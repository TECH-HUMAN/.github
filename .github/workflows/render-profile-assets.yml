name: Render profile assets

on:
  push:
    branches:
      - main
    paths:
      - profile/architecture.json
      - scripts/render-architecture-svg.mjs
      - .github/workflows/render-profile-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render SVG
        run: node scripts/render-architecture-svg.mjs

      - name: Commit rendered asset if needed
        run: |
          if ! git diff --quiet -- profile/techhuman-architecture.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add profile/techhuman-architecture.svg
            git commit -m "chore: render Tech Human architecture SVG"
            git push
          fi
